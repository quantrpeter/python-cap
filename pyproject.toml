[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-cap"
version = "0.1.0"
description = "Cross-platform screenshot tool with region select and annotation (arrows, shapes, brush)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.7"
authors = [
  { name = "Peter" }
]
keywords = ["screenshot", "screencap", "annotation", "cross-platform", "tkinter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: Capture",
]
dependencies = [
  "mss>=9.0.0",
  "pynput>=1.7.6",
  "Pillow>=10.0.0",
]

[project.scripts]
python-cap = "python_cap:main"

[tool.setuptools]
py-modules = ["python_cap"]
